   <script src="modernizr.custom.05819.js"></script>

   <style>
      body {
         font-family: Arial, Helvetica, sans-serif;
         background-color: #eeeeee;
      }

      .container {
         width: 900px;
         margin: 40px auto;
         overflow: hidden;
         box-shadow: 5px 8px 8px #777;
      }

      h1 {
         margin: 0;
         padding: 15px;
         text-align: center;
         background-color: #008c99;
         color: white;
         font-size: 40px;
         font-weight: normal;
      }

      article {
         background-color: #c87535;
         min-height: 220px;
         padding: 15px;
      }

      h2 {
         text-align: center;
         margin: 0 0 5px;
      }

      table {
         margin: auto;
         border-collapse: collapse;
         background-color: #e9a46e;
      }

      td, th {
         border: 2px solid #333;
         padding: 5px 12px;
         text-align: center;
      }
   </style>
</head>

<body>

<div class="container">

   <h1>Hands-on Project 1-2</h1>

   <article>

      <h2>High-Speed Internet Plans</h2>

      <script>
         //initialize variables for service names and speeds
         var service1Name = "Basic";
         var service2Name = "Express";
         var service3Name = "Extreme";
         var service4Name = "Ultimate";
         var service1Speed = 5;
         var service2Speed = 25;
         var service3Speed = 50;
         var service4Speed = 150;
      </script>

      <table>
         <thead>
            <tr>
               <th>Service</th>
               <th>Download Speed (mbps)</th>
            </tr>
         </thead>

         <tbody>
            <tr>
               <td><script>document.write(service1Name);</script></td>
               <td><script>document.write(service1Speed);</script></td>
            </tr>

            <tr>
               <td><script>document.write(service2Name);</script></td>
               <td><script>document.write(service2Speed);</script></td>
            </tr>

            <tr>
               <td><script>document.write(service3Name);</script></td>
               <td><script>document.write(service3Speed);</script></td>
            </tr>

            <tr>
               <td><script>document.write(service4Name);</script></td>
               <td><script>document.write(service4Speed);</script></td>
            </tr>
         </tbody>
      </table>

   </article>

</div>
