
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice | SmartShop</title>

    <!-- Bootstrap Framework -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- External CSS -->
    <link rel="stylesheet" href="invoice.css">
</head>

<body>

<main class="invoice-container">

    <form id="invoiceForm">

        <!-- Company Header -->
        <header class="company-header">
            <h1>SmartShop Online Store</h1>

            <input type="text"
                   aria-label="Company address"
                   placeholder="Address, City, ST, ZIP Code">

            <input type="text"
                   aria-label="Company phone and fax"
                   placeholder="Phone Number | Fax Number">
        </header>

        <!-- Invoice Information -->
        <section class="invoice-info">

            <h2>Invoice #
                <input type="text"
                       id="invoiceNumber"
                       aria-label="Invoice number"
                       value="100">
            </h2>

            <label for="invoiceDate">Date:</label>
            <input type="date" id="invoiceDate">

        </section>

        <!-- Customer Information -->
        <section class="customer-info row">

            <div class="col-md-8">
                <h2>Bill To</h2>

                <input type="text"
                       aria-label="Customer name"
                       placeholder="Name | Company">

                <input type="text"
                       aria-label="Customer address"
                       placeholder="Address, City, ST, ZIP Code">

                <input type="tel"
                       aria-label="Customer phone"
                       placeholder="Phone">
            </div>

            <div class="col-md-4">
                <h2>For</h2>

                <input type="text"
                       aria-label="Invoice purpose"
                       placeholder="Product Description">
            </div>

        </section>

        <!-- Invoice Item Table -->
        <section class="items-section">

            <table class="invoice-table">

                <thead>
                    <tr>
                        <th scope="col">Item Description</th>
                        <th scope="col">Amount</th>
                    </tr>
                </thead>

                <tbody>

                    <tr>
                        <td>
                            <input type="text"
                                   aria-label="Item 1 description">
                        </td>
                        <td>
                            <input type="number"
                                   class="amount"
                                   aria-label="Item 1 amount"
                                   min="0" step="0.01">
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <input type="text"
                                   aria-label="Item 2 description">
                        </td>
                        <td>
                            <input type="number"
                                   class="amount"
                                   aria-label="Item 2 amount"
                                   min="0" step="0.01">
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <input type="text"
                                   aria-label="Item 3 description">
                        </td>
                        <td>
                            <input type="number"
                                   class="amount"
                                   aria-label="Item 3 amount"
                                   min="0" step="0.01">
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <input type="text"
                                   aria-label="Item 4 description">
                        </td>
                        <td>
                            <input type="number"
                                   class="amount"
                                   aria-label="Item 4 amount"
                                   min="0" step="0.01">
                        </td>
                    </tr>

                </tbody>

            </table>

        </section>

        <!-- Invoice Totals -->
        <section class="totals-section">

            <table class="totals-table">

                <tr>
                    <th scope="row">Subtotal</th>
                    <td>
                        <output id="subtotal">$0.00</output>
                    </td>
                </tr>

                <tr>
                    <th scope="row">
                        <label for="taxRate">Tax Rate (%)</label>
                    </th>
                    <td>
                        <input type="number"
                               id="taxRate"
                               min="0"
                               max="100"
                               step="0.01">
                    </td>
                </tr>

                <tr>
                    <th scope="row">
                        <label for="otherCosts">Other Costs</label>
                    </th>
                    <td>
                        <input type="number"
                               id="otherCosts"
                               min="0"
                               step="0.01">
                    </td>
                </tr>

                <tr class="total-row">
                    <th scope="row">Total Cost</th>
                    <td>
                        <output id="totalCost"
                                aria-live="polite">$0.00</output>
                    </td>
                </tr>

            </table>

        </section>

        <!-- Footer Notes -->
        <footer class="invoice-footer">

            <p>
                Make all checks payable to SmartShop Online Store.
            </p>

            <p>
                If you have any questions concerning this invoice,
                use the following contact information:
            </p>

            <input type="text"
                   aria-label="Company contact information"
                   placeholder="Contact Name, Phone Number, Email">

            <p>Thank you for your business!</p>

        </footer>

    </form>

</main>

<!-- External JavaScript -->
<script src="invoice.js"></script>

</body>
</html>
