<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Invoice | SmartShop</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="invoice.css"></head>
<body><main class="invoice-container"><form id="invoiceForm">
<header class="company-header"><h1>SmartShop Online Store</h1><input aria-label="Company address" value="100 Example Street, Bronx, NY 10453"><input aria-label="Company phone" value="(718) 555-0142"></header>
<section class="invoice-info"><h2>Invoice # <input id="invoiceNumber" aria-label="Invoice number" value="100"></h2><label for="invoiceDate">Date:</label> <input type="date" id="invoiceDate"></section>
<section class="customer-info row g-0"><div class="col-md-8"><h2>Bill To</h2><input aria-label="Customer name" placeholder="Name | Company"><input aria-label="Customer address" placeholder="Address, City, ST, ZIP Code"><input type="tel" aria-label="Customer phone" placeholder="Phone"></div><div class="col-md-4"><h2>For</h2><input aria-label="Invoice purpose" placeholder="Product Description"></div></section>
<section class="items-section" aria-label="Invoice items"><table class="invoice-table"><thead><tr><th scope="col">Item Description</th><th scope="col">Amount</th></tr></thead><tbody><tr><td><input aria-label="Item 1 description"></td><td><input type="number" class="amount" min="0" step="0.01" aria-label="Item 1 amount"></td></tr><tr><td><input aria-label="Item 2 description"></td><td><input type="number" class="amount" min="0" step="0.01" aria-label="Item 2 amount"></td></tr><tr><td><input aria-label="Item 3 description"></td><td><input type="number" class="amount" min="0" step="0.01" aria-label="Item 3 amount"></td></tr><tr><td><input aria-label="Item 4 description"></td><td><input type="number" class="amount" min="0" step="0.01" aria-label="Item 4 amount"></td></tr></tbody></table></section>
<section class="totals-section" aria-label="Invoice totals"><table class="totals-table"><tbody><tr><th scope="row">Subtotal</th><td><output id="subtotal">$0.00</output></td></tr><tr><th scope="row"><label for="taxRate">Tax Rate (%)</label></th><td><input type="number" id="taxRate" min="0" max="100" step="0.01"></td></tr><tr><th scope="row"><label for="otherCosts">Other Costs</label></th><td><input type="number" id="otherCosts" min="0" step="0.01"></td></tr><tr class="total-row"><th scope="row">Total Cost</th><td><output id="totalCost" aria-live="polite">$0.00</output></td></tr></tbody></table><p id="error" role="status"></p></section>
<footer class="invoice-footer"><p>Make all checks payable to SmartShop Online Store.</p><p>If you have any questions concerning this invoice, use the following contact information:</p><input aria-label="Contact information" value="Mohammed Awuf | (718) 555-0142 | mohammedawf0@gmail.com"><p>Thank you for your business!</p></footer></form></main><script src="invoice.js"></script></body></html>
